name: Test PR #25 - Infisical Action
on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to run'
        required: false
        default: 'basic'
        type: choice
        options:
        - basic
        - file_export
        - recursive

jobs:
  test-pr-25:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Test PR #25 - Basic functionality
        if: github.event.inputs.test_scenario == 'basic' || github.event.inputs.test_scenario == ''
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "96643b53-6fc3-4cbc-a4c3-800bc795b408"
          client-secret: "fdb9c181e43be081c6ac73fa49db60bea669a5862a2e2255f8ee074472dc438e"
          domain: "https://app.infisical.com"
          env-slug: "dev"
          project-slug: "admin-2y-be"

      - name: Test PR #25 - File export
        if: github.event.inputs.test_scenario == 'file_export'
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "96643b53-6fc3-4cbc-a4c3-800bc795b408"
          client-secret: "fdb9c181e43be081c6ac73fa49db60bea669a5862a2e2255f8ee074472dc438e"
          domain: "https://app.infisical.com"
          env-slug: "dev"
          project-slug: "admin-2y-be"
          export-type: "file"
          file-output-path: "./test-secrets.env"

      - name: Test PR #25 - Recursive secrets
        if: github.event.inputs.test_scenario == 'recursive'
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "96643b53-6fc3-4cbc-a4c3-800bc795b408"
          client-secret: "fdb9c181e43be081c6ac73fa49db60bea669a5862a2e2255f8ee074472dc438e"
          domain: "https://app.infisical.com"
          env-slug: "dev"
          project-slug: "admin-2y-be"
          recursive: true
          secret-path: "/"

      - name: Validate environment variables (basic/recursive)
        if: github.event.inputs.test_scenario == 'basic' || github.event.inputs.test_scenario == 'recursive' || github.event.inputs.test_scenario == ''
        run: |
          echo "✅ Testing environment variable access..."
          echo "Available environment variables:"
          env | grep -v -E '^(PATH|HOME|USER|SHELL|PWD|OLDPWD|LANG|LC_|TERM|DISPLAY|SSH_|GITHUB_|RUNNER_|CI|NODE_)' | sort

      - name: Validate file export
        if: github.event.inputs.test_scenario == 'file_export'
        run: |
          echo "Testing file export functionality..."
          if [ -f "./test-secrets.env" ]; then
            echo "✅ Secrets file was created"
            echo "File contents:"
            cat ./test-secrets.env
          else
            echo "❌ Secrets file was not created"
            exit 1
          fi

      - name: Upload artifacts (file export test)
        if: github.event.inputs.test_scenario == 'file_export'
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: ./test-secrets.env

