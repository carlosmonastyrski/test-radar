name: Test PR #25 - Infisical Action
on:
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to run'
        required: false
        default: 'basic'
        type: choice
        options:
        - basic
        - file_export
        - recursive
        - with_headers

jobs:
  test-pr-25:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Test PR #25 - Basic functionality
        if: github.event.inputs.test_scenario == 'basic' || github.event.inputs.test_scenario == ''
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "0627787b-63bb-45d2-90c7-7e47cbb68dc6"
          client-secret: "d523192d966f5ab5f5e8de7b3e5cd110646449de39ecb14a42ad6a4f1254b75e"
          domain: "https://cd49f5101e7d.ngrok.app"
          env-slug: "prod-bk03"
          project-slug: "team-4-prod-6m-za"

      - name: Test PR #25 - File export
        if: github.event.inputs.test_scenario == 'file_export'
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "0627787b-63bb-45d2-90c7-7e47cbb68dc6"
          client-secret: "d523192d966f5ab5f5e8de7b3e5cd110646449de39ecb14a42ad6a4f1254b75e"
          domain: "https://cd49f5101e7d.ngrok.app"
          env-slug: "prod-bk03"
          project-slug: "team-4-prod-6m-za"
          export-type: "file"
          file-output-path: "./test-secrets.env"

      - name: Test PR #25 - Recursive secrets
        if: github.event.inputs.test_scenario == 'recursive'
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "0627787b-63bb-45d2-90c7-7e47cbb68dc6"
          client-secret: "d523192d966f5ab5f5e8de7b3e5cd110646449de39ecb14a42ad6a4f1254b75e"
          domain: "https://cd49f5101e7d.ngrok.app"
          env-slug: "prod-bk03"
          project-slug: "team-4-prod-6m-za"
          recursive: true
          secret-path: "/"

      - name: Test PR #25 - With extra headers
        if: github.event.inputs.test_scenario == 'with_headers'
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "0627787b-63bb-45d2-90c7-7e47cbb68dc6"
          client-secret: "d523192d966f5ab5f5e8de7b3e5cd110646449de39ecb14a42ad6a4f1254b75e"
          domain: "https://cd49f5101e7d.ngrok.app"
          env-slug: "prod-bk03"
          project-slug: "team-4-prod-6m-za"
          extra-headers: |
            Demo-Header: Something
            Demo-Header-2: Something-2
            Secure-Id: 1234567890

      - name: Validate environment variables (basic/recursive/with_headers)
        if: github.event.inputs.test_scenario == 'basic' || github.event.inputs.test_scenario == 'recursive' || github.event.inputs.test_scenario == 'with_headers' || github.event.inputs.test_scenario == ''
        run: |
          echo "Testing environment variable access..."
          if [ -n "$WRITE_ONLY_SECRET" ]; then
            echo "✅ WRITE_ONLY_SECRET is accessible"
          else
            echo "❌ WRITE_ONLY_SECRET is not accessible"
            exit 1
          fi

          echo "Available environment variables (excluding system vars):"
          env | grep -v '^[A-Z_]*=' | head -20
        env:
          WRITE_ONLY_SECRET: ${{ env.WRITE-ONLY-SECRET }}

      - name: Validate file export
        if: github.event.inputs.test_scenario == 'file_export'
        run: |
          echo "Testing file export functionality..."
          if [ -f "./test-secrets.env" ]; then
            echo "✅ Secrets file was created"
            echo "File contents:"
            cat ./test-secrets.env
          else
            echo "❌ Secrets file was not created"
            exit 1
          fi

      - name: Upload artifacts (file export test)
        if: github.event.inputs.test_scenario == 'file_export'
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: ./test-secrets.env

  test-error-handling:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Test PR #25 - Invalid credentials (should fail gracefully)
        continue-on-error: true
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"
          client-id: "invalid-client-id"
          client-secret: "invalid-secret"
          domain: "https://app.infisical.com"
          env-slug: "dev"
          project-slug: "test-project"

      - name: Test PR #25 - Missing required inputs (should fail)
        continue-on-error: true
        uses: Infisical/secrets-action@refs/pull/25/merge
        with:
          method: "universal"

      - name: Error handling validation complete
        run: echo "✅ Error handling tests completed"
